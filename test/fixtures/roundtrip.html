<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Rundlauf-Prüfung</title>
  </head>
  <body>
    <!--
      Prüfstand für den Emulator-Adapter — nicht Teil der App.

      Getestet wird die Zusage, auf der das ganze Speichersystem ruht: Ein
      Schnappschuss muss den Zustand exakt einfrieren und exakt
      wiederherstellen. Stimmt hier ein Byte nicht, verliert man später
      mitten in einem Level seinen Fortschritt.

      Genau das ging dem Vorgängerkern (WasmBoy) ab: Er lieferte jedes Mal
      denselben Speicher vom Ladezeitpunkt zurück, während das Spiel weiterlief.
      Deshalb prüft dieser Durchlauf ausdrücklich, dass sich die Stände
      überhaupt voneinander unterscheiden.

      Läuft über den Vite-Dev-Server, damit derselbe Quellcode geprüft wird,
      den auch die App benutzt — und keine Nachbildung.
    -->
    <canvas id="screen" width="160" height="144"></canvas>

    <script type="module">
      import { BinjgbCore } from '/src/emulator/binjgb-core.ts';

      const ergebnisse = [];
      const pruefe = (name, bestanden, detail = '') =>
        ergebnisse.push({ name, bestanden, detail });

      /**
       * Streng: alles, was kein befülltes Uint8Array ist, gilt als ungleich.
       * Eine nachsichtige Variante hatte hier schon einmal einen echten
       * Fehler zugedeckt, weil sie zwei leere Werte für identisch hielt.
       */
      const gleich = (a, b) => {
        if (!(a instanceof Uint8Array) || !(b instanceof Uint8Array)) return false;
        if (a.length === 0 || b.length === 0) return false;
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
        return true;
      };

      const warte = (ms) => new Promise((r) => setTimeout(r, ms));

      try {
        const core = new BinjgbCore();
        await core.init(document.getElementById('screen'));

        const antwort = await fetch('./generated/testrom.gb');
        const rom = new Uint8Array(await antwort.arrayBuffer());
        pruefe('ROM geladen', rom.length === 32768, `${rom.length} Bytes`);

        await core.loadRom(rom);
        await core.play();
        pruefe('Emulator läuft', core.isRunning());

        await warte(400);
        const a = await core.snapshot();
        const aVorher = a.data.slice();
        pruefe(
          'Schnappschuss enthält Daten',
          a.data instanceof Uint8Array && a.data.length > 0,
          `${a.data.length} Bytes`,
        );

        await warte(400);
        const b = await core.snapshot();

        // Das Testprogramm zählt eine Speicherzelle hoch. Sind zwei
        // Schnappschüsse identisch, stand der Emulator still — oder der Kern
        // liefert, wie der Vorgänger, immer denselben alten Speicher.
        pruefe(
          'Emulation schreitet voran',
          !gleich(a.data, b.data),
          'zwei Schnappschüsse müssen sich unterscheiden',
        );

        // Ein Schnappschuss muss ein Standbild sein, keine Sicht auf den
        // laufenden Speicher.
        pruefe(
          'Ein Schnappschuss bleibt unverändert',
          gleich(aVorher, a.data),
          'der erste Stand darf sich durch den zweiten nicht ändern',
        );

        // Kernzusage: zurückspielen und erneut sichern ergibt denselben Zustand.
        await core.restore(a);
        const c = await core.snapshot();
        pruefe('Wiederherstellung ist byte-genau', gleich(a.data, c.data), `${a.data.length} Bytes verglichen`);

        // Derselbe Stand muss beliebig oft ladbar sein — sonst wäre ein
        // Speicherplatz nach einmaligem Gebrauch verbraucht.
        await core.restore(a);
        const d = await core.snapshot();
        pruefe('Derselbe Stand lässt sich mehrfach laden', gleich(a.data, d.data));

        // Nach dem Laden muss es weiterlaufen können, ohne stehenzubleiben.
        await warte(400);
        const e = await core.snapshot();
        pruefe(
          'Nach dem Laden läuft die Emulation weiter',
          !gleich(a.data, e.data),
          'sonst hinge das Spiel nach jedem Laden',
        );

        // Ein Stand aus einem fremden Kern darf nicht stillschweigend
        // durchrutschen, sonst stürzt der Emulator irgendwo tief drinnen ab.
        let abgewiesen = false;
        try {
          await core.restore({ core: 'irgendein-anderer-kern', data: a.data });
        } catch {
          abgewiesen = true;
        }
        pruefe('Fremder Speicherstand wird abgewiesen', abgewiesen);

        // Ein zu kurzer Stand ebenso — etwa der eines anderen Spiels.
        let laengeGeprueft = false;
        try {
          await core.restore({ core: a.core, data: a.data.slice(0, 32) });
        } catch {
          laengeGeprueft = true;
        }
        pruefe('Stand mit falscher Länge wird abgewiesen', laengeGeprueft);

        await core.pause();
        pruefe('Pause hält den Emulator an', !core.isRunning());


        // Neustart muss den Ausgangszustand herstellen, nicht den letzten.
        await core.reset();
        const nachReset = await core.snapshot();
        pruefe(
          'Neustart setzt den Zustand zurück',
          !gleich(nachReset.data, e.data),
          'sonst startete das Spiel mitten im Geschehen',
        );

        // ---------------------------------------------------------------
        // Erreichen Tastendrücke überhaupt den Emulator?
        //
        // Genau das war lange kaputt: `set_joyp_*` schreibt nur in eine
        // statische Struktur im WASM-Modul, und ohne angemeldeten
        // Joypad-Callback liest sie niemand aus. Das Gehäuse hob die Taste
        // hervor, das Spiel bekam nie etwas mit. Deshalb wird hier nicht die
        // Anzeige geprüft, sondern das Bild, das der Emulator erzeugt.
        //
        // Das Prüf-ROM schreibt die gedrückten Tasten unmittelbar in die
        // Hintergrundpalette — Tastendruck heißt also: Bildschirm wechselt.
        const leeresPad = {
          UP: false, DOWN: false, LEFT: false, RIGHT: false,
          A: false, B: false, START: false, SELECT: false,
        };

        const joypadRom = new Uint8Array(
          await (await fetch('./generated/joypad.gb')).arrayBuffer(),
        );
        await core.loadRom(joypadRom);
        await core.play();
        await warte(400);

        const bildschirmfarbe = () => {
          const canvas = document.getElementById('screen');
          const daten = canvas.getContext('2d').getImageData(0, 0, 8, 8).data;
          return `${daten[0]},${daten[1]},${daten[2]}`;
        };

        const ohneTaste = bildschirmfarbe();
        core.setJoypad({ ...leeresPad, A: true });
        await warte(400);
        const mitTaste = bildschirmfarbe();

        pruefe(
          'Tastendruck erreicht den Emulator',
          ohneTaste !== mitTaste,
          `ohne: ${ohneTaste} · mit A: ${mitTaste}`,
        );

        core.setJoypad({ ...leeresPad });
        await warte(400);
        pruefe(
          'Loslassen wirkt ebenfalls',
          bildschirmfarbe() === ohneTaste,
          'sonst bliebe eine Taste hängen',
        );

        await core.pause();
        // ---------------------------------------------------------------
        // Ungültiger Befehl: anhalten und melden, nicht einfrieren.
        //
        // So sah der Fehler im Spiel aus: Der Emulator meldete ein Ereignis,
        // das die Schleife nicht behandelte, brach ab, ohne das Zeitziel zu
        // erreichen — und der Rückstand ging in die nächste Runde. Das Ziel
        // wuchs Bild für Bild, bis ein einzelner Frame Millionen Zyklen am
        // Stück abarbeiten sollte. Die ganze Seite stand still.
        //
        // Kehrt das zurück, bleibt dieser Durchlauf hängen und läuft in die
        // Zeitüberschreitung — auch das ist ein aussagekräftiges Ergebnis.
        // Wichtig: derselbe Kern, keine zweite Instanz. binjgbs Wrapper hält
        // den Emulator in einer globalen Variable (`static Emulator* e`), die
        // der Joypad-Callback mitbenutzt. Eine zweite Instanz überschreibt
        // sie, und nach dem Freigeben greift die erste ins Leere — genau
        // dieser Test hat sich daran zuerst selbst zerlegt.
        let gemeldet = null;
        core.onProblem = (m) => (gemeldet = m);
        await core.loadRom(
          new Uint8Array(await (await fetch('./generated/badop.gb')).arrayBuffer()),
        );
        await core.play();
        await warte(1200);

        pruefe(
          'Ungültiger Befehl wird gemeldet',
          typeof gemeldet === 'string' && /ungültigen Befehl/.test(gemeldet),
          gemeldet ? gemeldet.slice(0, 70) : 'keine Meldung',
        );
        pruefe('Emulator hält danach an', !core.isRunning(), 'statt weiterzudrehen');

        // Der entscheidende Punkt: Die Seite muss danach noch reagieren.
        const vorher = performance.now();
        await warte(300);
        const verzoegerung = performance.now() - vorher - 300;
        pruefe(
          'Seite bleibt bedienbar',
          verzoegerung < 500,
          `Verzögerung ${Math.round(verzoegerung)} ms — bei aufgeschaukeltem Rückstand wären es Sekunden`,
        );

      } catch (fehler) {
        pruefe('Durchlauf ohne Ausnahme', false, String(fehler?.stack ?? fehler));
      }

      window.__ergebnisse = ergebnisse;
      document.title = 'fertig';
    </script>
  </body>
</html>
