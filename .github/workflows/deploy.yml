name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/adventures-lolo-iphone-game-m1ln81
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy noch, darf der nächste ihn nicht überholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 wegen --experimental-strip-types: Die Tests laden die
          # TypeScript-Quellen direkt, ohne Übersetzungsschritt.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
